name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Static analysis, unit tests, lint, coverage
        run: ./gradlew check koverXmlReportDebug --stacktrace
      - name: Release build (R8, debug-signed)
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: findora-release-apk
          path: app/build/outputs/apk/release/*.apk
