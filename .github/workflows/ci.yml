name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its own run; superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  validation:
    name: Wrapper and dependency validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # dependency-submission uploads the Gradle dependency graph on main
      pull-requests: write # dependency-review comments on PRs
    steps:
      - uses: actions/checkout@v7
      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Submit dependency graph (main)
        if: github.event_name == 'push'
        uses: gradle/actions/dependency-submission@v6
      - name: Review dependency changes (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  check:
    name: Static analysis, unit tests, lint, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: detekt, Spotless, unit tests, Android Lint, Kover
        run: |
          set -o pipefail
          ./gradlew check koverXmlReportDebug --continue --stacktrace 2>&1 | tee gradle-check.log

      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/kover-summary.py app/build/reports/kover/reportDebug.xml

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh gradle-check.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-reports
          path: |
            gradle-check.log
            app/build/reports
            build/reports

  instrumented:
    name: Instrumented tests (emulator API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_LEVEL: 34
      TARGET: google_apis
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee build-android-test.log

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-v1

      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace > connected.log 2>&1; status=$?; cat connected.log; exit $status

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh build-android-test.log connected.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-reports
          path: |
            connected.log
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  release-build:
    name: Release build (APK + AAB)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The check job owns cache writes; avoid racing on the same entries.
          cache-read-only: true

      - name: assembleRelease + bundleRelease (R8; debug-signed without keystore secrets)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee release.log

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh release.log

      - uses: actions/upload-artifact@v7
        with:
          name: findora-release-ci
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
