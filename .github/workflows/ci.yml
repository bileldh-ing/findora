name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Static analysis, unit tests, lint, coverage
        run: |
          set -o pipefail
          ./gradlew check koverXmlReportDebug --continue --stacktrace 2>&1 | tee gradle-check.log

      - name: Release build (R8, debug-signed)
        run: ./gradlew :app:assembleRelease

      - name: Report failures as annotations
        if: failure()
        run: |
          annotate() { python3 -c 'import sys,urllib.parse as u; t=sys.stdin.read()[:6000]; print(t.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          if [ -f gradle-check.log ]; then
            echo "::error title=Gradle failure::$(grep -A25 'What went wrong' gradle-check.log | annotate)"
          fi
          for f in app/build/reports/lint-results-*.txt; do
            [ -f "$f" ] && echo "::error title=Android Lint ($f)::$(grep -E 'Error:|Warning:' "$f" | annotate)"
          done
          failures=$(grep -rhoE '<failure message="[^"]{0,400}' app/build/test-results 2>/dev/null | head -20)
          [ -n "$failures" ] && echo "::error title=Unit test failures::$(echo "$failures" | annotate)"
          true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            gradle-check.log
            app/build/reports
            build/reports
      - uses: actions/upload-artifact@v7
        with:
          name: findora-release-apk
          path: app/build/outputs/apk/release/*.apk
