name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its own run; superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  validation:
    name: Wrapper and dependency validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # dependency-submission can submit the Gradle dependency graph on main
      pull-requests: write # dependency-review comments on PRs
    steps:
      - uses: actions/checkout@v7
      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # The resolved Gradle dependency graph is always generated (uploaded as an artifact). It is also
      # submitted to GitHub (Dependabot alerts, dependency review) once the repository's Dependency
      # graph is enabled and the DEPENDENCY_GRAPH_ENABLED variable is 'true' (see CONTRIBUTING.md).
      - name: Resolve dependency graph
        if: github.event_name != 'pull_request'
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: ${{ vars.DEPENDENCY_GRAPH_ENABLED == 'true' && 'generate-submit-and-upload' || 'generate-and-upload' }}
      - name: Review dependency changes (PR)
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  check:
    name: Static analysis, unit tests, lint, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # Offline and dependency-free: compares the committed seed, regions and credits with a fresh generation.
      - name: Seed dataset is current
        run: python3 scripts/build_seed/build_seed.py --check

      - name: detekt, Spotless, unit tests, Android Lint, Kover
        run: |
          set -o pipefail
          ./gradlew check koverXmlReportDebug --continue --stacktrace 2>&1 | tee gradle-check.log

      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/kover-summary.py app/build/reports/kover/reportDebug.xml

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh gradle-check.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-reports
          path: |
            gradle-check.log
            app/build/reports
            build/reports
            app/schemas

  screenshots:
    name: Screenshot tests (Roborazzi)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Verify key-screen goldens (light/dark, LTR/RTL)
        run: .github/scripts/screenshots.sh

      - name: Verify Google Play store images (screenshots, feature graphic, icon)
        if: success() || failure()
        run: .github/scripts/store-assets.sh

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh screenshots.log store-assets.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: |
            screenshots.log
            store-assets.log
            fastlane/metadata/android/en-US/images
            app/src/test/screenshots
            app/build/outputs/roborazzi
            app/build/reports/tests/testDebugUnitTest

  store-readiness:
    name: Store readiness (listing, graphics, version, policy)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Readiness script self-test
        run: python3 -m unittest discover -s scripts/store -p 'test_*.py' -v
      - name: Play listing lengths, required files, image sizes, versionCode/versionName
        run: python3 scripts/store/check_store_readiness.py --summary "$GITHUB_STEP_SUMMARY"

  instrumented:
    name: Instrumented tests (emulator API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_LEVEL: 34
      TARGET: google_apis
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee build-android-test.log

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-v1

      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace > connected.log 2>&1; status=$?; cat connected.log; exit $status

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh build-android-test.log connected.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-reports
          path: |
            connected.log
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  release-build:
    name: Release build (APK + AAB)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The check job owns cache writes; avoid racing on the same entries.
          cache-read-only: true

      - name: assembleRelease + bundleRelease (R8; debug-signed without keystore secrets)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee release.log

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh release.log

      - uses: actions/upload-artifact@v7
        with:
          name: findora-release-ci
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

  performance:
    name: Baseline Profile + startup Macrobenchmark (emulator API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      API_LEVEL: 34
      TARGET: google_apis
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build release-like app and benchmark APKs (R8)
        run: |
          set -o pipefail
          ./gradlew :app:assembleNonMinifiedRelease :app:assembleBenchmarkRelease --stacktrace 2>&1 | tee build-perf.log

      # The Google APIs image (userdebug) supports profile generation without root on API 33+; aosp_atd does not.
      - name: Generate Baseline Profile, then run the startup benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # A phone-sized screen (1080 x 2400) so the journey and the frame metrics match a real handset.
          profile: pixel_6
          script: .github/scripts/perf.sh

      - name: Benchmark status (informational)
        if: always()
        run: |
          status=$(cat benchmark-status.txt 2>/dev/null || echo "not run")
          if [ "$status" != "0" ]; then
            echo "::warning title=Macrobenchmark::Startup benchmark did not complete on the emulator (status: $status); see benchmark.log in the performance artifact. Not a merge gate."
          fi
          python3 .github/scripts/benchmark-summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh build-perf.log baseline-profile.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance
          path: |
            build-perf.log
            baseline-profile.log
            benchmark.log
            app/src/release/generated/baselineProfiles
            baselineprofile/build/outputs/connected_android_test_additional_output
            baselineprofile/build/outputs/androidTest-results
